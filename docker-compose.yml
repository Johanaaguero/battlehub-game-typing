# Typing Battle en local: MySQL, la API, el microfrontend de Typing y el generador de datos de ejemplo.
# Toda la configuración sale de .env y no hay valores por defecto: si falta una variable, Compose se
# detiene y dice cuál. Antes de la primera vez, copiar la plantilla:
#
#   cp .env.example .env               (PowerShell: Copy-Item .env.example .env)
#   docker compose up -d --build       todo: MySQL, la API, el microfrontend y los datos de ejemplo
#   docker compose up -d mysql         solo MySQL, para correr las pruebas de integración
#   docker compose down                (agregar -v para borrar también los datos)

services:
  mysql:
    image: mysql:8.4
    container_name: typing-battle-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?falta en .env}
      MYSQL_USER: ${MYSQL_USER:?falta en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?falta en .env}
    ports:
      - "${MYSQL_PORT:?falta en .env}:3306"
    volumes:
      - typing-mysql-data:/var/lib/mysql
    healthcheck:
      # Con $$, Compose no reemplaza la variable: la expande el shell del contenedor con su propio valor.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/backend/TypingBattle.Api/Dockerfile
    image: typing-battle-api:local
    container_name: typing-battle-api
    # La API aplica las migraciones al arrancar: necesita MySQL listo, no solo iniciado.
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__Typing: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:?falta en .env};User ID=${MYSQL_USER:?falta en .env};Password=${MYSQL_PASSWORD:?falta en .env}
      Database__MigrateOnStartup: "true"
      Cors__AllowedOrigins__0: ${CORS_SHELL_ORIGIN:?falta en .env}
      Cors__AllowedOrigins__1: ${CORS_FRONTEND_ORIGIN:?falta en .env}
    ports:
      - "${API_PORT:?falta en .env}:8080"

  frontend:
    build:
      context: src/frontend
      args:
        # URL de la API tal como la usa el navegador. Queda fija al construir la imagen.
        TYPING_API_URL: ${TYPING_API_URL:?falta en .env}
    image: typing-battle-frontend:local
    container_name: typing-battle-frontend
    # Sin depends_on: son archivos estáticos y es el navegador el que llama a la API.
    ports:
      - "${FRONTEND_PORT:?falta en .env}:8080"

  # R-28: proceso aparte que registra partidas de ejemplo con POST /results de la API pública. No usa el código de la
  # API, ni sus migraciones, ni un seed. Espera a que la API responda /health, registra las partidas y termina con
  # código 0 (queda como Exited (0)). Los ids son fijos (demo-0001…): volver a ejecutarlo no duplica nada.
  data-generator:
    build:
      context: src/data-generator
    image: typing-battle-data-generator:local
    container_name: typing-battle-data-generator
    depends_on:
      api:
        condition: service_started
    restart: "no"
    environment:
      # La API por la red interna del compose, igual que Server=mysql;Port=3306 en la cadena de conexión.
      DATA_API_URL: http://api:8080
      DATA_MATCHES: ${DATA_MATCHES:?falta en .env}
      DATA_WAIT_SECONDS: ${DATA_WAIT_SECONDS:?falta en .env}
      # Puede quedar vacía, pero la variable debe existir en .env.
      DATA_EXTRA_PLAYERS: ${DATA_EXTRA_PLAYERS?falta en .env}

volumes:
  typing-mysql-data:
