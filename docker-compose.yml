# Typing Battle en local: MySQL (ADR-005), la API y el microfrontend de Typing.
# La configuración se lee de .env (plantilla: .env.example). Sin .env se usan los valores de desarrollo,
# que coinciden con appsettings.Development.json y con el valor por defecto de las pruebas de integración
# (TYPING_TEST_MYSQL).
#
#   docker compose up -d --build     todo (reemplaza a dotnet run en el puerto 5015 y a npm start en el 4001)
#   docker compose up -d mysql       solo MySQL, para correr la API con dotnet run o las pruebas
#   docker compose down              (agregar -v para borrar también los datos)

services:
  mysql:
    image: mysql:8.4
    container_name: typing-battle-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-typing_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-typing_battle}
      MYSQL_USER: ${MYSQL_USER:-typing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-typing_dev}
    ports:
      - "3306:3306"
    volumes:
      - typing-mysql-data:/var/lib/mysql
    healthcheck:
      # Con $$, Compose no reemplaza la variable: la expande el shell del contenedor con su propio valor.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/backend/TypingBattle.Api/Dockerfile
    image: typing-battle-api:local
    container_name: typing-battle-api
    # La API aplica las migraciones al arrancar: necesita MySQL listo, no solo iniciado.
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__Typing: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-typing_battle};User ID=${MYSQL_USER:-typing};Password=${MYSQL_PASSWORD:-typing_dev}
      Database__MigrateOnStartup: "true"
      Cors__AllowedOrigins__0: ${CORS_SHELL_ORIGIN:-http://localhost:4000}
      Cors__AllowedOrigins__1: ${CORS_FRONTEND_ORIGIN:-http://localhost:4001}
    ports:
      - "5015:8080"

  frontend:
    build:
      context: frontend
      args:
        # URL de la API tal como la usa el navegador. Queda fija al construir la imagen.
        TYPING_API_URL: ${TYPING_API_URL:-http://localhost:5015}
    image: typing-battle-frontend:local
    container_name: typing-battle-frontend
    # Sin depends_on: son archivos estáticos y es el navegador el que llama a la API.
    ports:
      - "4001:8080"

volumes:
  typing-mysql-data:
