# nginx del microfrontend de Typing Battle (remote typingGame) dentro del contenedor.
# Reemplaza /etc/nginx/conf.d/default.conf de la imagen nginx-unprivileged.

# Los archivos con hash en el nombre (por ejemplo 557.e8fd1a9d954a7d8a3f03.bundle.js) nunca cambian,
# así que se guardan en caché un año. remoteEntry.js e index.html no llevan hash: se revalidan siempre,
# para que el Shell reciba la versión nueva después de cada despliegue.
map $uri $typing_cache_control {
    "~\.[0-9a-f]{8,}\.bundle\.js$"  "public, max-age=31536000, immutable";
    default                         "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No revelar la versión de nginx en las respuestas ni en las páginas de error.
    server_tokens off;

    # El Shell descarga remoteEntry.js y los chunks desde otro origen (ADR-003). Son archivos públicos
    # y no usan cookies, así que se permite cualquier origen, igual que en el servidor de desarrollo.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control $typing_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # Sin fallback a index.html: si falta un chunk, el Shell recibe un 404 claro en lugar de HTML.
        try_files $uri $uri/ =404;
    }
}
