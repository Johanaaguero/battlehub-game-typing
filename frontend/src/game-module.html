<template>
    <section class="typing-game">

        <!-- ================================================= -->
        <!-- HEADER -->
        <!-- ================================================= -->

        <header class="typing-game-header">

            <div class="typing-game-brand">

                <div class="typing-game-brand-line">
                    <span class="typing-game-brand-mark"></span>

                    <span class="typing-game-brand-system">
                        BATTLEHUB ARENA
                    </span>
                </div>

                <h1>
                    TYPING
                    <span class="typing-game-title-accent">BATTLE</span>
                </h1>

                <p class="typing-game-subtitle">
                    Competitive Typing Arena
                </p>

                <div
                    if.bind="context"
                    class="typing-game-match-info">

                    <span>SESSION</span>

                    <strong>
                        ${context.matchId}
                    </strong>

                </div>

            </div>

            <div class="typing-game-header-hud">

                <div class="typing-game-match-state">

                    <span
                        if.bind="!isTimeUp && !matchFinished"
                        class="typing-game-state-dot typing-game-live-dot">
                    </span>

                    <span
                        if.bind="isTimeUp && !matchFinished"
                        class="typing-game-state-dot typing-game-waiting-dot">
                    </span>

                    <span
                        if.bind="matchFinished"
                        class="typing-game-state-dot typing-game-finished-dot">
                    </span>

                    <strong
                        if.bind="!isTimeUp && !matchFinished">
                        LIVE
                    </strong>

                    <strong
                        if.bind="isTimeUp && !matchFinished">
                        WAITING
                    </strong>

                    <strong
                        if.bind="matchFinished">
                        FINISHED
                    </strong>

                </div>

                <div class="typing-game-timer-box">

                    <span class="typing-game-timer-label">
                        TIME LEFT
                    </span>

                    <strong class="typing-game-timer-value">
                        ${timeRemaining}
                    </strong>

                    <span class="typing-game-timer-unit">
                        SEC
                    </span>

                </div>

            </div>

        </header>

        <!-- ================================================= -->
        <!-- CURRENT PLAYER -->
        <!-- ================================================= -->

        <div
            if.bind="context"
            class="typing-game-current-user">

            <div class="typing-game-current-user-indicator"></div>

            <span>
                PLAYER
            </span>

            <strong>
                ${context.currentUser.displayName}
            </strong>

        </div>

        <div
            if.bind="!context"
            class="typing-game-waiting-message">

            Esperando información de la partida...

        </div>

        <div if.bind="context">

            <!-- ============================================= -->
            <!-- NAVIGATION -->
            <!-- ============================================= -->

            <nav class="typing-game-tabs">

                <button
                    type="button"
                    class.bind="
                        activeSection === 'game'
                            ? 'typing-game-tab typing-game-active-tab'
                            : 'typing-game-tab'
                    "
                    click.trigger="showGame()">

                    <span class="typing-game-tab-number">
                        01
                    </span>

                    JUEGO

                </button>

                <button
                    type="button"
                    class.bind="
                        activeSection === 'history'
                            ? 'typing-game-tab typing-game-active-tab'
                            : 'typing-game-tab'
                    "
                    click.trigger="showHistory()">

                    <span class="typing-game-tab-number">
                        02
                    </span>

                    HISTORIAL

                </button>

                <button
                    type="button"
                    class.bind="
                        activeSection === 'stats'
                            ? 'typing-game-tab typing-game-active-tab'
                            : 'typing-game-tab'
                    "
                    click.trigger="showStats()">

                    <span class="typing-game-tab-number">
                        03
                    </span>

                    ESTADÍSTICAS

                </button>

            </nav>

            <!-- ============================================= -->
            <!-- GAME -->
            <!-- ============================================= -->

            <div
                if.bind="activeSection === 'game'"
                class="typing-game-content">

                <main class="typing-game-typing-area">

                    <!-- ===================================== -->
                    <!-- PROGRESS -->
                    <!-- ===================================== -->

                    <div class="typing-game-section-top">

                        <div>
                            <span class="typing-game-section-code">
                                MATCH PROGRESS
                            </span>

                            <h2>
                                Carrera de escritura
                            </h2>
                        </div>

                        <div class="typing-game-progress-number">
                            ${progress}%
                        </div>

                    </div>

                    <div class="typing-game-progress-bar">

                        <div
                            class="typing-game-progress-fill"
                            style="width: ${progress}%">
                        </div>

                    </div>

                    <!-- ===================================== -->
                    <!-- METRICS -->
                    <!-- ===================================== -->

                    <div class="typing-game-typing-stats">

                        <div class="typing-game-stat-box typing-game-accuracy-stat">

                            <div class="typing-game-stat-decoration"></div>

                            <span>
                                PRECISIÓN
                            </span>

                            <strong>
                                ${accuracy}%
                            </strong>

                            <small>
                                Accuracy
                            </small>

                        </div>

                        <div class="typing-game-stat-box typing-game-correct-stat">

                            <div class="typing-game-stat-decoration"></div>

                            <span>
                                CORRECTOS
                            </span>

                            <strong>
                                ${correctCharacters}
                            </strong>

                            <small>
                                Hits
                            </small>

                        </div>

                        <div class="typing-game-stat-box typing-game-error-stat">

                            <div class="typing-game-stat-decoration"></div>

                            <span>
                                ERRORES
                            </span>

                            <strong>
                                ${incorrectCharacters}
                            </strong>

                            <small>
                                Misses
                            </small>

                        </div>

                    </div>

                    <!-- ===================================== -->
                    <!-- TARGET TEXT -->
                    <!-- ===================================== -->

                    <div class="typing-game-text-card">

                        <div class="typing-game-card-heading">

                            <div>
                                <span class="typing-game-section-code">
                                    TARGET
                                </span>

                                <h2>
                                    Texto objetivo
                                </h2>
                            </div>

                            <span class="typing-game-target-status">
                                READY
                            </span>

                        </div>

                        <p>
                            ${targetText}
                        </p>

                    </div>

                    <!-- ===================================== -->
                    <!-- TYPING INPUT -->
                    <!-- ===================================== -->

                    <div class="typing-game-input-card">

                        <div class="typing-game-input-heading">

                            <label for="typingInput">
                                TYPE ZONE
                            </label>

                            <span>
                                Escribí exactamente el texto superior
                            </span>

                        </div>

                        <div class="typing-game-typing-console">

                            <div class="typing-game-console-top">

                                <div class="typing-game-console-dots">
                                    <span class="typing-game-console-dot-red"></span>
                                    <span class="typing-game-console-dot-yellow"></span>
                                    <span class="typing-game-console-dot-green"></span>
                                </div>

                                <span>
                                    battlehub://typing-input
                                </span>

                            </div>

                            <textarea
                                id="typingInput"
                                rows="5"
                                placeholder="Comenzá a escribir aquí..."
                                value.bind="typedText"
                                input.trigger="handleTyping()"
                                disabled.bind="!canType"></textarea>

                        </div>

                    </div>

                    <!-- ===================================== -->
                    <!-- TEXT COMPLETED -->
                    <!-- ===================================== -->

                    <section
                        if.bind="
                            completed &&
                            !isTimeUp &&
                            !matchFinished
                        "
                        class="typing-game-waiting-result-section">

                        <div class="typing-game-waiting-result-header">

                            <div>

                                <span class="typing-game-results-label">
                                    TEXT COMPLETED
                                </span>

                                <h2>
                                    ¡Completaste el texto!
                                </h2>

                            </div>

                            <span class="typing-game-waiting-status">
                                WAITING
                            </span>

                        </div>

                        <p class="typing-game-waiting-result-message">
                            Tus métricas quedaron registradas.
                            La partida termina cuando se acabe el tiempo.
                        </p>

                    </section>

                    <!-- ===================================== -->
                    <!-- WAITING RESULT -->
                    <!-- ===================================== -->

                    <section
                        if.bind="
                            isTimeUp &&
                            !matchFinished
                        "
                        class="typing-game-waiting-result-section">

                        <div class="typing-game-waiting-result-header">

                            <div>

                                <span class="typing-game-results-label">
                                    TIME OVER
                                </span>

                                <h2>
                                    Tu participación terminó
                                </h2>

                            </div>

                            <span class="typing-game-waiting-status">
                                SYNCING RESULT
                            </span>

                        </div>

                        <p class="typing-game-waiting-result-message">
                            Tus métricas finales están listas.
                            Esperando el resultado oficial de la partida...
                        </p>

                        <div class="typing-game-final-stats">

                            <div class="typing-game-final-stat">
                                <span>WPM</span>
                                <strong>${wpm}</strong>
                            </div>

                            <div class="typing-game-final-stat">
                                <span>PRECISIÓN</span>
                                <strong>${accuracy}%</strong>
                            </div>

                            <div class="typing-game-final-stat">
                                <span>PROGRESO</span>
                                <strong>${progress}%</strong>
                            </div>

                        </div>

                    </section>

                    <!-- ===================================== -->
                    <!-- FINAL RESULT -->
                    <!-- ===================================== -->

                    <section
                        if.bind="matchFinished"
                        class="typing-game-results-section">

                        <div class="typing-game-results-header">

                            <div>

                                <span class="typing-game-results-label">
                                    MATCH COMPLETE
                                </span>

                                <h2>
                                    Resultado final
                                </h2>

                            </div>

                            <span
                                if.bind="matchOutcome"
                                class="typing-game-result-status">

                                ${matchOutcome}

                            </span>

                        </div>

                        <p
                            if.bind="resultMessage"
                            class="typing-game-result-message">

                            ${resultMessage}

                        </p>

                        <div
                            if.bind="finalResult"
                            class="typing-game-final-results-content">

                            <div
                                if.bind="winnerName"
                                class="typing-game-winner-card">

                                <span class="typing-game-winner-label">
                                    CHAMPION
                                </span>

                                <strong class="typing-game-winner-name">
                                    ${winnerName}
                                </strong>

                            </div>

                            <div class="typing-game-final-stats">

                                <div class="typing-game-final-stat">
                                    <span>WPM</span>
                                    <strong>${wpm}</strong>
                                </div>

                                <div class="typing-game-final-stat">
                                    <span>PRECISIÓN</span>
                                    <strong>${accuracy}%</strong>
                                </div>

                                <div class="typing-game-final-stat">
                                    <span>PROGRESO</span>
                                    <strong>${progress}%</strong>
                                </div>

                            </div>

                            <div class="typing-game-ranking-section">

                                <div class="typing-game-ranking-title">

                                    <span class="typing-game-section-code">
                                        LEADERBOARD
                                    </span>

                                    <h3>
                                        Clasificación
                                    </h3>

                                </div>

                                <div class="typing-game-ranking-list">

                                    <div
                                        repeat.for="
                                            resultPlayer
                                            of finalResult.players
                                        "
                                        class.bind="
                                            isWinner(
                                                resultPlayer.userId
                                            )
                                                ? 'typing-game-ranking-player typing-game-ranking-winner'
                                                : 'typing-game-ranking-player'
                                        ">

                                        <div class="typing-game-ranking-position">
                                            ${$index + 1}
                                        </div>

                                        <div class="typing-game-ranking-player-info">

                                            <strong>
                                                ${resultPlayer.displayName}
                                            </strong>

                                            <span
                                                if.bind="
                                                    resultPlayer.userId ===
                                                    context.currentUser.id
                                                "
                                                class="typing-game-you-badge">

                                                YOU

                                            </span>

                                            <span
                                                if.bind="
                                                    isWinner(
                                                        resultPlayer.userId
                                                    )
                                                "
                                                class="typing-game-winner-badge">

                                                WINNER

                                            </span>

                                        </div>

                                        <div class="typing-game-ranking-score">

                                            <span>
                                                SCORE
                                            </span>

                                            <strong>
                                                ${resultPlayer.score}
                                            </strong>

                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </section>

                </main>

                <!-- ========================================= -->
                <!-- PLAYERS -->
                <!-- ========================================= -->

                <aside class="typing-game-players-panel">

                    <div class="typing-game-players-header">

                        <div>

                            <span class="typing-game-section-code">
                                LOBBY
                            </span>

                            <h2>
                                Jugadores
                            </h2>

                        </div>

                        <span class="typing-game-players-count">
                            ${players.length}
                        </span>

                    </div>

                    <div
                        class="typing-game-lobby-status">

                        <span class="typing-game-lobby-pulse"></span>

                        REAL-TIME SYNC

                    </div>

                    <div
                        repeat.for="player of players"
                        class.bind="
                            player.userId ===
                            context.currentUser.id
                                ? 'typing-game-player-card typing-game-current-player-card'
                                : 'typing-game-player-card'
                        ">

                        <div class="typing-game-player-avatar">
                            ${player.displayName[0]}
                        </div>

                        <div class="typing-game-player-info">

                            <div class="typing-game-player-name">

                                <strong>
                                    ${player.displayName}
                                </strong>

                                <span
                                    if.bind="
                                        player.userId ===
                                        context.currentUser.id
                                    "
                                    class="typing-game-you-badge">

                                    YOU

                                </span>

                            </div>

                            <div class="typing-game-player-mini-stats">

                                <span>
                                    ${player.wpm ?? 0}
                                    WPM
                                </span>

                                <span>
                                    ${player.accuracy ?? 0}%
                                    ACC
                                </span>

                            </div>

                        </div>

                        <div
                            if.bind="
                                player.score !== null
                            "
                            class="typing-game-player-score">

                            <span>
                                SCORE
                            </span>

                            <strong>
                                ${player.score}
                            </strong>

                        </div>

                    </div>

                    <div
                        if.bind="
                            players.length === 0
                        "
                        class="typing-game-no-players">

                        Esperando jugadores...

                    </div>

                </aside>

            </div>

            <!-- ============================================= -->
            <!-- HISTORY -->
            <!-- ============================================= -->

            <section
                if.bind="
                    activeSection === 'history'
                "
                class="typing-game-data-section">

                <div class="typing-game-data-section-header">

                    <div>

                        <span class="typing-game-section-code">
                            PLAYER RECORD
                        </span>

                        <h2>
                            Historial de partidas
                        </h2>

                        <p>
                            Tus partidas más recientes
                            de Typing Battle.
                        </p>

                    </div>

                    <button
                        type="button"
                        class="typing-game-refresh-button"
                        disabled.bind="historyLoading"
                        click.trigger="refreshHistory()">

                        ACTUALIZAR

                    </button>

                </div>

                <div
                    if.bind="historyLoading"
                    class="typing-game-loading-state">

                    Sincronizando historial...

                </div>

                <div
                    if.bind="
                        historyError &&
                        !historyLoading
                    "
                    class="typing-game-error-state">

                    ${historyError}

                </div>

                <div
                    if.bind="
                        historyLoaded &&
                        !historyLoading &&
                        history.length === 0
                    "
                    class="typing-game-empty-state">

                    <span class="typing-game-empty-code">
                        NO DATA
                    </span>

                    Todavía no tenés partidas registradas.

                </div>

                <div
                    if.bind="
                        history.length > 0 &&
                        !historyLoading
                    "
                    class="typing-game-history-list">

                    <article
                        repeat.for="item of history"
                        class.bind="
                            item.won
                                ? 'typing-game-history-card typing-game-history-win'
                                : 'typing-game-history-card'
                        ">

                        <div class="typing-game-history-main">

                            <div>

                                <div class="typing-game-history-title">

                                    <strong>
                                        ${item.matchId}
                                    </strong>

                                    <span
                                        if.bind="item.won"
                                        class="typing-game-win-badge">

                                        VICTORY

                                    </span>

                                </div>

                                <span class="typing-game-history-date">
                                    ${formatDate(
                                        item.finishedAt
                                    )}
                                </span>

                            </div>

                            <div class="typing-game-history-position">

                                <span>
                                    RANK
                                </span>

                                <strong>
                                    ${item.position}
                                    /
                                    ${item.playersCount}
                                </strong>

                            </div>

                        </div>

                        <div class="typing-game-history-metrics">

                            <div>
                                <span>SCORE</span>
                                <strong>${item.score}</strong>
                            </div>

                            <div>
                                <span>WPM</span>
                                <strong>
                                    ${formatMetric(
                                        item.wpm
                                    )}
                                </strong>
                            </div>

                            <div>
                                <span>ACCURACY</span>
                                <strong>
                                    ${formatMetric(
                                        item.accuracy
                                    )}%
                                </strong>
                            </div>

                        </div>

                    </article>

                </div>

            </section>

            <!-- ============================================= -->
            <!-- STATS -->
            <!-- ============================================= -->

            <section
                if.bind="
                    activeSection === 'stats'
                "
                class="typing-game-data-section">

                <div class="typing-game-data-section-header">

                    <div>

                        <span class="typing-game-section-code">
                            PERFORMANCE CORE
                        </span>

                        <h2>
                            Estadísticas
                        </h2>

                        <p>
                            Resumen de tu rendimiento
                            en Typing Battle.
                        </p>

                    </div>

                    <button
                        type="button"
                        class="typing-game-refresh-button"
                        disabled.bind="statsLoading"
                        click.trigger="refreshStats()">

                        ACTUALIZAR

                    </button>

                </div>

                <div
                    if.bind="statsLoading"
                    class="typing-game-loading-state">

                    Calculando estadísticas...

                </div>

                <div
                    if.bind="
                        statsError &&
                        !statsLoading
                    "
                    class="typing-game-error-state">

                    ${statsError}

                </div>

                <div
                    if.bind="
                        stats &&
                        !statsLoading
                    "
                    class="typing-game-stats-dashboard">

                    <div class="typing-game-stats-grid">

                        <div class="typing-game-stats-card">
                            <span>PARTIDAS</span>
                            <strong>
                                ${stats.gamesPlayed}
                            </strong>
                        </div>

                        <div class="typing-game-stats-card">
                            <span>VICTORIAS</span>
                            <strong>
                                ${stats.wins}
                            </strong>
                        </div>

                        <div class="typing-game-stats-card">
                            <span>WIN RATE</span>
                            <strong>
                                ${winRatePercentage}%
                            </strong>
                        </div>

                        <div class="typing-game-stats-card">
                            <span>AVG SCORE</span>
                            <strong>
                                ${stats.averageScore}
                            </strong>
                        </div>

                        <div class="typing-game-stats-card">
                            <span>BEST SCORE</span>
                            <strong>
                                ${stats.bestScore}
                            </strong>
                        </div>

                        <div class="typing-game-stats-card">
                            <span>AVG WPM</span>
                            <strong>
                                ${formatMetric(
                                    stats.averageWpm
                                )}
                            </strong>
                        </div>

                        <div class="typing-game-stats-card">
                            <span>BEST WPM</span>
                            <strong>
                                ${formatMetric(
                                    stats.bestWpm
                                )}
                            </strong>
                        </div>

                        <div class="typing-game-stats-card">
                            <span>AVG ACCURACY</span>
                            <strong>
                                ${formatMetric(
                                    stats.averageAccuracy
                                )}%
                            </strong>
                        </div>

                    </div>

                    <div class="typing-game-last-played-card">

                        <div>
                            <span>
                                LAST MATCH
                            </span>

                            <small>
                                Última actividad registrada
                            </small>
                        </div>

                        <strong>
                            ${formatDate(
                                stats.lastPlayedAt
                            )}
                        </strong>

                    </div>

                </div>

            </section>

        </div>

    </section>
</template>
