# CI del Equipo 4 (Typing Battle).
# Implementa 05-cicd-testing-commits.md de battlehub-contracts: en cada PR hacia main (y en cada
# push a main) corren tres jobs, porque el repositorio tiene la API (.NET 10), el microfrontend (Aurelia)
# y sus imágenes de Docker:
# - Backend: restore, build, migraciones al día, pruebas unitarias y de integración contra un MySQL 8.4
#   real (ADR-005), levantado como servicio.
# - Frontend: install, lint, build y pruebas, con Node 22 desde src/frontend/.nvmrc (ADR-003).
# - Docker: construye las imágenes de la API y del frontend, sin publicarlas, para detectar si un cambio
#   rompe un Dockerfile.
#
# No agregar filtros "paths:" a los triggers: si un check obligatorio no se ejecuta,
# el PR queda esperándolo indefinidamente.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DOTNET_NOLOGO: true
      # Sin TLS: el MySQL del CI es temporal, y el conector MySql.Data falla a veces al negociar TLS
      # en varias conexiones a la vez (bug #111759 de bugs.mysql.com).
      TYPING_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=ci_root;SslMode=Disabled"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore

      - name: Migraciones al día con el modelo
        # dotnet ef solo arma el modelo y no se conecta a MySQL: basta una cadena sin credenciales.
        env:
          ConnectionStrings__Typing: "Server=localhost;Database=typing_ci"
        run: dotnet ef migrations has-pending-model-changes --project src/backend/TypingBattle.Api --no-build

      - name: Unit tests
        run: dotnet test --no-build --filter "Category=Unit"

      - name: Integration tests
        run: dotnet test --no-build --filter "Category=Integration"

  frontend:
    name: Frontend (Aurelia)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (src/frontend/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      - name: Build (genera dist/remoteEntry.js)
        # La URL de la API es obligatoria al compilar; aquí solo importa que el build funcione.
        env:
          TYPING_API_URL: http://localhost:5015
        run: npm run build

      - name: Unit tests
        run: npx jest --ci

  docker:
    name: Docker (imágenes)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Los mismos comandos de la documentación; los runners de GitHub ya traen Docker.
      - name: Imagen de la API
        run: docker build -f src/backend/TypingBattle.Api/Dockerfile -t typing-battle-api:ci .

      - name: Imagen del frontend
        run: docker build --build-arg TYPING_API_URL=http://localhost:5015 -t typing-battle-frontend:ci src/frontend
