# CI del Equipo 4 (Typing Battle).
# Implementa 05-cicd-testing-commits.md de battlehub-contracts: en cada PR hacia main (y en cada
# push a main) corren dos jobs, porque el repositorio tiene la API (.NET 10) y el microfrontend (Aurelia):
# - Backend: restore, build, migraciones al día, pruebas unitarias y de integración contra un MySQL 8.4
#   real (ADR-005), levantado como servicio.
# - Frontend: install, lint, build y pruebas, con Node 24 desde frontend/.nvmrc (ADR-003).
#
# No agregar filtros "paths:" a los triggers: si un check obligatorio no se ejecuta,
# el PR queda esperándolo indefinidamente.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DOTNET_NOLOGO: true
      TYPING_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User ID=root;Password=ci_root"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore

      - name: Migraciones al día con el modelo
        run: dotnet ef migrations has-pending-model-changes --project src/backend/TypingBattle.Api --no-build

      - name: Unit tests
        run: dotnet test --no-build --filter "Category=Unit"

      - name: Integration tests
        run: dotnet test --no-build --filter "Category=Integration"

  frontend:
    name: Frontend (Aurelia)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (frontend/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint + Stylelint)
        run: npm run lint

      - name: Build (genera dist/remoteEntry.js)
        run: npm run build

      - name: Unit tests
        run: npx jest --ci
